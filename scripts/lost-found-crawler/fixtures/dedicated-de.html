<!doctype html>
<html lang="de">
  <head>
    <title>Verlustmeldung</title>
  </head>
  <body>
    <main>
      <h1>Gegenstand verloren</h1>
      <form action="/fundservice/senden" method="post">
        <input type="hidden" name="csrf_token" value="must-not-be-stored">
        <label for="loss-date">Verlustdatum</label>
        <input id="loss-date" name="verlustdatum" type="date" required>

        <label for="loss-place">Wo haben Sie den Gegenstand verloren?</label>
        <input id="loss-place" name="verlustort" required>

        <label for="category">Gegenstandsart</label>
        <select id="category" name="kategorie" required>
          <option value="">Bitte wählen</option>
          <option value="bag">Tasche</option>
          <option value="phone">Mobiltelefon</option>
        </select>

        <label for="description">Beschreibung und besondere Merkmale</label>
        <textarea
          id="description"
          name="beschreibung"
          minlength="10"
          maxlength="1000"
          required
        ></textarea>

        <label for="email">E-Mail</label>
        <input
          id="email"
          name="email"
          type="email"
          value="secret@example.invalid"
          required
        >

        <label>
          <input name="privacy" type="checkbox" required>
          Ich akzeptiere die Datenschutzerklärung
        </label>

        <button type="submit">Meldung senden</button>
      </form>
    </main>
  </body>
</html>
